<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <h1>iQamata LiKhaya</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero">
            <h2>Get Involved / Enquiry Form</h2>
            <p>Join us in driving social upliftment by signing up as a volunteer or sponsor[cite: 1].</p>
            
            <form style="max-width: 500px; margin: 2rem auto; text-align: left; display: flex; flex-direction: column; gap: 1rem;">
                <div>
                    <label for="name" style="font-weight: bold; display: block; margin-bottom: 0.5rem;">Full Name:</label>
                    <input type="text" id="name" name="name" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div>
                    <label for="email" style="font-weight: bold; display: block; margin-bottom: 0.5rem;">Email Address:</label>
                    <input type="email" id="email" name="email" required style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                </div>
                <div>
                    <label for="role" style="font-weight: bold; display: block; margin-bottom: 0.5rem;">I want to join as a:</label>
                    <select id="role" name="role" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;">
                        <option value="volunteer">Volunteer</option>
                        <option value="sponsor">Sponsor</option>
                        <option value="donor">Donor</option>
                    </select>
                </div>
                <div>
                    <label for="message" style="font-weight: bold; display: block; margin-bottom: 0.5rem;">Message / Motivation:</label>
                    <textarea id="message" name="message" rows="4" style="width: 100%; padding: 0.5rem; border: 1px solid #ccc; border-radius: 4px;"></textarea>
                </div>
                <button type="submit" class="btn" style="border: none; cursor: pointer;">Submit Enquiry</button>
            </form>
        </section>
    </main>

    <footer>
        <p>&copy; 2026 iQamata LiKhaya NPO. Registration number: 307-938 NPO[cite: 1].</p>
    </footer>
</body>
</html>
