<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iQamata LiKhaya - Enquiry</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <header>
        <nav>
            <h1>iQamata LiKhaya</h1>
            <ul>
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About Us</a></li>
                <li><a href="services.html">Services</a></li>
                <li><a href="enquiry.html">Enquiry</a></li>
                <li><a href="contact.html">Contact</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section class="hero" style="padding: 2rem 1rem;">
            <div class="form-card" style="max-width: 600px; margin: 0 auto; background: #ffffff; padding: 2.5rem; border-radius: 12px; box-shadow: 0 8px 20px rgba(0,0,0,0.08); text-align: left;">
                
                <div style="text-align: center; margin-bottom: 2rem;">
                    <h2 style="color: #2c3e50; margin-bottom: 0.5rem;">Get Involved / Enquiry Form</h2>
                    <p style="color: #666; font-size: 0.95rem;">Join us in driving social upliftment by signing up as a volunteer or sponsor.</p>
                </div>

                <form style="display: flex; flex-direction: column; gap: 1.25rem;">
                    <div>
                        <label for="name" style="font-weight: 600; display: block; margin-bottom: 0.4rem; color: #333;">Full Name:</label>
                        <input type="text" id="name" name="name" required placeholder="Enter your full name" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; background: #fafafa;">
                    </div>

                    <div>
                        <label for="email" style="font-weight: 600; display: block; margin-bottom: 0.4rem; color: #333;">Email Address:</label>
                        <input type="email" id="email" name="email" required placeholder="Enter your email address" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; background: #fafafa;">
                    </div>

                    <div>
                        <label for="role" style="font-weight: 600; display: block; margin-bottom: 0.4rem; color: #333;">I want to join as a:</label>
                        <select id="role" name="role" style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; background: #fafafa;">
                            <option value="volunteer">Volunteer</option>
                            <option value="sponsor">Sponsor</option>
                            <option value="donor">Donor</option>
                        </select>
                    </div>

                    <div>
                        <label for="message" style="font-weight: 600; display: block; margin-bottom: 0.4rem; color: #333;">Message / Motivation:</label>
                        <textarea id="message" name="message" rows="4" placeholder="Tell us how you would like to get involved..." style="width: 100%; padding: 0.75rem; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; background: #fafafa; resize: vertical;"></textarea>
                    </div>

                    <button type="submit" class="btn" style="background: #2c3e50; color: white; padding: 0.85rem; border: none; border-radius: 6px; font-size: 1rem; font-weight: bold; cursor: pointer; transition: background 0.3s ease; margin-top: 0.5rem;">Submit Enquiry</button>
                </form>

            </div>
        </section>
    </main>

    <footer>
        <p>&copy; 2021- 2026 iQamata LiKhaya NPO. Registration number: 307-938 NPO.</p>
    </footer>
</body>
</html>
